<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Битва Пустыни - Рекорды</title>
    <style>
        body {
            margin: 0;
            background: #5e3c25;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #8c6c52;
            border: 4px solid #4a3120;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 350px;
            margin-top: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        button {
            width: 70px;
            height: 70px;
            font-size: 30px;
            background: #ffd700;
            border: 3px solid #b89400;
            border-radius: 50%;
            font-weight: bold;
            color: #5e3c25;
            box-shadow: 0 6px 0 #b89400;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s;
        }
        button:active {
            background: #e6c200;
            box-shadow: 0 2px 0 #b89400;
            transform: translateY(4px);
        }
        .fire-btn {
            background: #ff5252;
            border: 3px solid #b83b3b;
            box-shadow: 0 6px 0 #b83b3b;
            color: white;
        }
        .fire-btn:active {
            background: #e04848;
            box-shadow: 0 2px 0 #b83b3b;
        }
        header {
            position: absolute;
            top: 15px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }
        h1 { margin: 0; font-size: 22px;}
        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 16px;
            margin-top: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>БИТВА ПУСТЫНИ</h1>
        <div class="score-board">
            <span id="scoreText">Очки: 0</span>
            <span id="highScoreText">Рекорд: 0</span>
        </div>
    </header>

    <canvas id="gameCanvas" width="360" height="340"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button id="leftBtn">◀</button>
            <button id="rightBtn">▶</button>
        </div>
        <button id="fireBtn" class="fire-btn">🔥</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Игрок
        let player = {
            x: 180,
            y: 290,
            size: 25,
            speed: 4,
            icon: '🤖'
        };

        // Игровая статистика и рекорды
        let score = 0;
        let highscore = localStorage.getItem('brawl_highscore') || 0;

        // Обновляем текст рекорда на экране сразу
        document.getElementById("highScoreText").innerText = `Рекорд: ${highscore}`;

        // Пули
        let bullets = [];

        // Препятствия
        let walls = [
            { x: 60, y: 100, w: 80, h: 25, icon: '🧱' },
            { x: 200, y: 180, w: 90, h: 25, icon: '🧱' }
        ];

        let movingLeft = false;
        let movingRight = false;

        function addListeners(btnId, action) {
            const btn = document.getElementById(btnId);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); action(true); });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); action(false); });
            btn.addEventListener("mousedown", () => action(true));
            btn.addEventListener("mouseup", () => action(false));
        }

        addListeners("leftBtn", (isMoving) => movingLeft = isMoving);
        addListeners("rightBtn", (isMoving) => movingRight = isMoving);

        document.getElementById("fireBtn").addEventListener("click", () => {
            bullets.push({
                x: player.x,
                y: player.y - player.size / 2,
                speed: 6,
                icon: '❇️'
            });

            // Начисляем очки за каждый выстрел
            score += 10;
            updateScoreUI();
        });

        function updateScoreUI() {
            document.getElementById("scoreText").innerText = `Очки: ${score}`;
            
            // Проверка и сохранение рекорда
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('brawl_highscore', highscore);
                document.getElementById("highScoreText").innerText = `Рекорд: ${highscore}`;
            }
        }

        function update() {
            if (movingLeft) player.x -= player.speed;
            if (movingRight) player.x += player.speed;

            if (player.x < player.size) player.x = player.size;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "25px 'Courier New'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            walls.forEach(w => {
                for (let ix = w.x; ix < w.x + w.w; ix += 20) {
                    for (let iy = w.y; iy < w.y + w.h; iy += 20) {
                        ctx.fillText(w.icon, ix + 10, iy + 12);
                    }
                }
            });

            ctx.font = "40px 'Segoe UI Emoji'";
            ctx.fillText(player.icon, player.x, player.y);

            ctx.font = "20px 'Segoe UI Emoji'";
            bullets.forEach(b => {
                ctx.fillText(b.icon, b.x, b.y);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
