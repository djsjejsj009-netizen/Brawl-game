<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Битва Пустыни - Прототип</title>
    <style>
        body {
            margin: 0;
            background: #5e3c25; /* Цвет песка на фоне */
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Стиль шрифта под ретро */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #8c6c52; /* Цвет песка на арене */
            border: 4px solid #4a3120; /* Каменистая граница */
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 350px; /* Чуть шире кнопки */
            margin-top: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        button {
            width: 70px;
            height: 70px;
            font-size: 30px;
            background: #ffd700; /* Золотые кнопки */
            border: 3px solid #b89400;
            border-radius: 50%;
            font-weight: bold;
            color: #5e3c25;
            box-shadow: 0 6px 0 #b89400; /* Эффект нажатия */
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s;
        }
        button:active {
            background: #e6c200;
            box-shadow: 0 2px 0 #b89400;
            transform: translateY(4px);
        }
        .fire-btn {
            background: #ff5252; /* Красная кнопка огня */
            border: 3px solid #b83b3b;
            box-shadow: 0 6px 0 #b83b3b;
            color: white;
        }
        .fire-btn:active {
            background: #e04848;
            box-shadow: 0 2px 0 #b83b3b;
        }
        /* Добавим небольшое описание сверху */
        header {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }
        h1 { margin: 0; font-size: 24px;}
        p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8;}
    </style>
</head>
<body>

    <header>
        <h1>БИТВА ПУСТЫНИ</h1>
        <p>Твой первый прототип</p>
    </header>

    <canvas id="gameCanvas" width="360" height="360"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button id="leftBtn">◀</button>
            <button id="rightBtn">▶</button>
        </div>
        <button id="fireBtn" class="fire-btn">🔥</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Игрок - теперь визуально "пиксель-арт" (текст)
        let player = {
            x: 180, // Центр поля
            y: 310,
            size: 25, // Чуть больше
            speed: 4, // Чуть быстрее
            dx: 0,
            icon: '🤖' // Иконка робота (можно заменить на '🔫')
        };

        // Пули
        let bullets = [];

        // Препятствия (стены) - визуально "каменные блоки" (текст)
        let walls = [
            { x: 60, y: 120, w: 80, h: 25, icon: '🧱' },
            { x: 200, y: 200, w: 90, h: 25, icon: '🧱' }
        ];

        // Управление с кнопок
        let movingLeft = false;
        let movingRight = false;

        function addListeners(btnId, action) {
            const btn = document.getElementById(btnId);
            // Для телефона (touch)
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); action(true); });
            btn.addEventListener("touchend", (e) => { e.preventDefault(); action(false); });
            // Для компьютера (mouse)
            btn.addEventListener("mousedown", () => action(true));
            btn.addEventListener("mouseup", () => action(false));
        }

        addListeners("leftBtn", (isMoving) => movingLeft = isMoving);
        addListeners("rightBtn", (isMoving) => movingRight = isMoving);

        document.getElementById("fireBtn").addEventListener("click", () => {
            bullets.push({
                x: player.x,
                y: player.y - player.size / 2,
                speed: 6,
                icon: '❇️' // Иконка пули
            });
        });

        function update() {
            // Движение игрока
            if (movingLeft) player.x -= player.speed;
            if (movingRight) player.x += player.speed;

            // Границы экрана
            if (player.x < player.size) player.x = player.size;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;

            // Обновление пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        function draw() {
            // Очистка экрана
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем стены (текстом)
            ctx.fillStyle = "white";
            ctx.font = "25px 'Courier New'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            walls.forEach(w => {
                // Заполняем прямоугольник иконками
                for (let ix = w.x; ix < w.x + w.w; ix += 20) {
                    for (let iy = w.y; iy < w.y + w.h; iy += 20) {
                        ctx.fillText(w.icon, ix + 10, iy + 12);
                    }
                }
            });

            // Рисуем игрока (иконкой)
            ctx.font = "40px 'Segoe UI Emoji'"; // Шрифт для эмодзи
            ctx.fillText(player.icon, player.x, player.y);

            // Рисуем пули (иконкой)
            ctx.font = "20px 'Segoe UI Emoji'";
            bullets.forEach(b => {
                ctx.fillText(b.icon, b.x, b.y);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
