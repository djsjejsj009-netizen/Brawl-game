
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Brawl Prototype</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            background: #2e7d32;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="360" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Игрок
        let player = {
            x: 180,
            y: 500,
            radius: 18,
            color: '#00d2ff',
            speed: 3.5
        };

        let targetX = player.x;
        let targetY = player.y;
        let isMoving = false;

        // Управление пальцем или мышкой
        canvas.addEventListener('pointerdown', (e) => {
            updateTarget(e);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (isMoving) {
                updateTarget(e);
            }
        });

        canvas.addEventListener('pointerup', () => {
            isMoving = false;
        });

        function updateTarget(e) {
            const rect = canvas.getBoundingClientRect();
            targetX = e.clientX - rect.left;
            targetY = e.clientY - rect.top;
            isMoving = true;
        }

        // Обновление логики игры
        function update() {
            if (isMoving) {
                let dx = targetX - player.x;
                let dy = targetY - player.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 2) {
                    player.x += (dx / distance) * player.speed;
                    player.y += (dy / distance) * player.speed;
                }
            }
        }

        // Отрисовка графики
        function draw() {
            // Очистка экрана (трава арены)
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем элементы арены (стены/препятствия)
            ctx.fillStyle = '#795548';
            ctx.fillRect(60, 150, 80, 30);
            ctx.fillRect(220, 150, 80, 30);
            ctx.fillRect(140, 350, 80, 30);

            // Рисуем игрока (боец)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            // Интерфейс (название режима)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(10, 10, 120, 30);
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText('ЗАХВАТ КРИСТАЛЛОВ', 15, 30);
        }

        // Главный игровой цикл
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
